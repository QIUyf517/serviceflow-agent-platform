<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">阶段 5 开发集与保留集成功率</title>
<desc id="desc">开发集单 Agent 73.33%，多 Agent V3 80%；保留集单 Agent 42.50%，多 Agent V3 37.50%。</desc>
<style>
  text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #202733; }
  .title { font-size: 24px; font-weight: 700; } .subtitle { font-size: 14px; fill: #596273; }
  .grid { stroke: #D9DEE7; stroke-width: 1; } .tick { font-size: 13px; fill: #667085; }
  .value { font-size: 15px; font-weight: 700; } .label { font-size: 14px; font-weight: 600; }
  .split { font-size: 13px; fill: #667085; } .note { font-size: 13px; fill: #596273; }
</style>
<rect width="900" height="520" fill="#FFFFFF"/>
<text x="95" y="42" class="title">开发集优势在独立保留集反转</text>
<text x="95" y="68" class="subtitle">成功率；开发集与保留集是不同任务集合，不应纵向解释为同一任务退化</text>
<line x1="95" y1="390" x2="805" y2="390" class="grid"/><text x="78" y="395" text-anchor="end" class="tick">0%</text><line x1="95" y1="330" x2="805" y2="330" class="grid"/><text x="78" y="335" text-anchor="end" class="tick">20%</text><line x1="95" y1="270" x2="805" y2="270" class="grid"/><text x="78" y="275" text-anchor="end" class="tick">40%</text><line x1="95" y1="210" x2="805" y2="210" class="grid"/><text x="78" y="215" text-anchor="end" class="tick">60%</text><line x1="95" y1="150" x2="805" y2="150" class="grid"/><text x="78" y="155" text-anchor="end" class="tick">80%</text><line x1="95" y1="90" x2="805" y2="90" class="grid"/><text x="78" y="95" text-anchor="end" class="tick">100%</text>
<line x1="95" y1="90" x2="95" y2="390" stroke="#8892A3"/>
<line x1="95" y1="390" x2="805" y2="390" stroke="#8892A3"/>
<rect x="170" y="170.0" width="86" height="220.0" rx="4" fill="#2559A7"/><text x="213" y="160.0" text-anchor="middle" class="value">73.33%</text><text x="213" y="420" text-anchor="middle" class="label">单 Agent</text><text x="213" y="444" text-anchor="middle" class="split">开发集</text><rect x="300" y="150.0" width="86" height="240.0" rx="4" fill="#D18B22"/><text x="343" y="140.0" text-anchor="middle" class="value">80.00%</text><text x="343" y="420" text-anchor="middle" class="label">多 Agent V3</text><text x="343" y="444" text-anchor="middle" class="split">开发集</text><rect x="530" y="262.5" width="86" height="127.5" rx="4" fill="#2559A7"/><text x="573" y="252.5" text-anchor="middle" class="value">42.50%</text><text x="573" y="420" text-anchor="middle" class="label">单 Agent</text><text x="573" y="444" text-anchor="middle" class="split">保留集</text><rect x="660" y="277.5" width="86" height="112.5" rx="4" fill="#D18B22"/><text x="703" y="267.5" text-anchor="middle" class="value">37.50%</text><text x="703" y="420" text-anchor="middle" class="label">多 Agent V3</text><text x="703" y="444" text-anchor="middle" class="split">保留集</text>
<text x="95" y="486" class="note">保留集：40 项 × 3 次；V3 − 单 Agent = −5.00 个百分点，配对近似 95% CI [−11.9, +1.9]。</text>
</svg>
